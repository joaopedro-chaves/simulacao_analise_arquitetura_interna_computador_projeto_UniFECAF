<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hefesto (Codename)</title>
  <meta name="description"
    content="Jogo educativo 2D top-down: explore uma placa-mãe e aprenda o que faz cada componente do computador.">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <!-- Canvas de tela cheia que ocupa 100% da janela do navegador -->
  <canvas id="game"></canvas>

  <!-- HUD e Sobreposições de Interface -->
  <header id="hud-header">
    <h1 id="game-title">HEFESTO <span>// Alpha Build</span></h1>
    <div id="help">
      <div id="help-section">
        <p><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> ou setas para mover</p>
        <p><kbd>E</kbd> interagir</p>
        <p><kbd>Esc</kbd> fechar</p>
      </div>
    </div>
  </header>

  <div id="prompt" class="hidden">Pressione <kbd>E</kbd> para interagir</div>

  <section id="dialog" class="hidden" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
    <h2 id="dialog-title"></h2>
    <p id="dialog-role"></p>
    <p id="dialog-text"></p>
    <p id="dialog-fun"></p>
    <button id="dialog-close" type="button">Fechar <kbd>Esc</kbd></button>
  </section>

  <!-- Scripts clássicos (funcionam abrindo o index.html direto, sem servidor) -->
  <script src="js/config.js"></script>
  <script src="js/components.js"></script>
  <script src="js/input.js"></script>
  <script src="js/player.js"></script>
  <script src="js/world.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>

</html>
