<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%" style="background:#ffffff; font-family:'Roboto', 'Segoe UI', Arial, sans-serif;">
  <defs>
    <!-- Marcadores de setas -->
    <marker id="arrow-addr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0052cc" />
    </marker>
    <marker id="arrow-data" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#00875a" />
    </marker>
    <marker id="arrow-ctrl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#de350b" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Título e Subtítulo -->
  <text x="500" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#172b4d">NeoCore 8-bit CPU — Diagrama Geral da Arquitetura</text>
  <text x="500" y="50" text-anchor="middle" font-size="12" fill="#5e6c84">Modelo Von Neumann com Organização de Acumulador (Recorte Didático PoC UniFECAF)</text>

  <!-- ==================== BLOCO CPU ==================== -->
  <rect x="220" y="80" width="560" height="420" rx="10" fill="#f4f5f7" stroke="#42526e" stroke-width="2" stroke-dasharray="6,4" />
  <text x="235" y="105" font-size="15" font-weight="700" fill="#42526e">CPU (Unidade Central de Processamento)</text>

  <!-- Registrador PC -->
  <g id="reg-PC" filter="url(#shadow)">
    <rect x="250" y="130" width="100" height="50" rx="4" fill="#ffffff" stroke="#172b4d" stroke-width="2" />
    <text x="300" y="152" text-anchor="middle" font-size="13" font-weight="700" fill="#0052cc">PC</text>
    <text x="300" y="168" text-anchor="middle" font-size="10" fill="#5e6c84">Contador (8b)</text>
  </g>

  <!-- Registrador MAR -->
  <g id="reg-MAR" filter="url(#shadow)">
    <rect x="250" y="240" width="100" height="50" rx="4" fill="#ffffff" stroke="#172b4d" stroke-width="2" />
    <text x="300" y="262" text-anchor="middle" font-size="13" font-weight="700" fill="#0052cc">MAR</text>
    <text x="300" y="278" text-anchor="middle" font-size="10" fill="#5e6c84">Endereço (8b)</text>
  </g>

  <!-- Registrador MBR -->
  <g id="reg-MBR" filter="url(#shadow)">
    <rect x="250" y="360" width="100" height="50" rx="4" fill="#ffffff" stroke="#172b4d" stroke-width="2" />
    <text x="300" y="382" text-anchor="middle" font-size="13" font-weight="700" fill="#00875a">MBR</text>
    <text x="300" y="398" text-anchor="middle" font-size="10" fill="#5e6c84">Buffer Dados (8b)</text>
  </g>

  <!-- Registrador IR -->
  <g id="reg-IR" filter="url(#shadow)">
    <rect x="420" y="130" width="100" height="50" rx="4" fill="#ffffff" stroke="#172b4d" stroke-width="2" />
    <text x="470" y="152" text-anchor="middle" font-size="13" font-weight="700" fill="#172b4d">IR</text>
    <text x="470" y="168" text-anchor="middle" font-size="10" fill="#5e6c84">Instrução (8b)</text>
  </g>

  <!-- Bloco Unidade de Controle (UC) -->
  <g id="blk-UC" filter="url(#shadow)">
    <rect x="410" y="230" width="120" height="70" rx="6" fill="#fff0b3" stroke="#ffab00" stroke-width="2" />
    <text x="470" y="258" text-anchor="middle" font-size="13" font-weight="700" fill="#172b4d">Unidade de Controle</text>
    <text x="470" y="274" text-anchor="middle" font-size="10" fill="#5e6c84">Decodificador / FSM</text>
    <text x="470" y="288" text-anchor="middle" font-size="9" fill="#de350b">Manual (5p) / Auto (12s)</text>
  </g>

  <!-- Bloco ULA -->
  <g id="blk-ULA" filter="url(#shadow)">
    <!-- Trapézio ULA -->
    <path d="M 590 320 L 670 340 L 670 400 L 590 420 L 590 380 L 605 370 L 590 360 Z" fill="#ebecf0" stroke="#172b4d" stroke-width="2" />
    <text x="635" y="375" text-anchor="middle" font-size="14" font-weight="700" fill="#172b4d">ULA</text>
    <text x="635" y="390" text-anchor="middle" font-size="9" fill="#5e6c84">Adder 8b</text>
  </g>

  <!-- Registrador AC -->
  <g id="reg-AC" filter="url(#shadow)">
    <rect x="650" y="200" width="100" height="55" rx="4" fill="#ffffff" stroke="#172b4d" stroke-width="2" />
    <text x="700" y="224" text-anchor="middle" font-size="14" font-weight="700" fill="#00875a">AC</text>
    <text x="700" y="240" text-anchor="middle" font-size="10" fill="#5e6c84">Acumulador (8b)</text>
  </g>

  <!-- ==================== BLOCOS EXTERNOS ==================== -->

  <!-- Memória RAM 256x8 -->
  <g id="blk-RAM" filter="url(#shadow)">
    <rect x="40" y="210" width="120" height="180" rx="6" fill="#deebff" stroke="#0052cc" stroke-width="2" />
    <text x="100" y="240" text-anchor="middle" font-size="14" font-weight="700" fill="#0747a6">RAM</text>
    <text x="100" y="258" text-anchor="middle" font-size="11" font-weight="600" fill="#0747a6">256 × 8</text>
    <text x="100" y="278" text-anchor="middle" font-size="9.5" fill="#5e6c84">00h a FFh</text>
    <line x1="45" y1="290" x2="155" y2="290" stroke="#b3d4ff" stroke-width="1" />
    <text x="50" y="315" font-size="10" font-weight="700" fill="#0052cc">A (End)</text>
    <text x="50" y="355" font-size="10" font-weight="700" fill="#00875a">D (E/S)</text>
  </g>

  <!-- Teclado (Entrada 8 bits) -->
  <g id="blk-Teclado" filter="url(#shadow)">
    <rect x="40" y="110" width="120" height="50" rx="4" fill="#e3fcef" stroke="#00875a" stroke-width="2" />
    <text x="100" y="132" text-anchor="middle" font-size="12" font-weight="700" fill="#006644">Teclado (Entrada)</text>
    <text x="100" y="148" text-anchor="middle" font-size="9.5" fill="#5e6c84">Porta E/S 8 bits</text>
  </g>

  <!-- Monitor / SAIDA (Saída 8 bits) -->
  <g id="blk-Monitor" filter="url(#shadow)">
    <rect x="830" y="200" width="130" height="60" rx="4" fill="#eae6ff" stroke="#6554c0" stroke-width="2" />
    <text x="895" y="225" text-anchor="middle" font-size="12" font-weight="700" fill="#403294">Monitor / SAIDA</text>
    <text x="895" y="242" text-anchor="middle" font-size="9.5" fill="#5e6c84">Display 8 bits (E/S)</text>
  </g>

  <!-- Gerador de Clock (1.0 Hz) -->
  <g id="blk-Clock">
    <circle cx="470" cy="455" r="22" fill="#ffebe6" stroke="#de350b" stroke-width="2" />
    <path d="M 458 455 L 464 447 L 470 455 L 476 447 L 482 455" fill="none" stroke="#de350b" stroke-width="2" stroke-linecap="round" />
    <text x="470" y="490" text-anchor="middle" font-size="11" font-weight="700" fill="#de350b">CLOCK (1,0 Hz)</text>
  </g>

  <!-- ==================== BARRAMENTO DE ENDEREÇOS (AZUL) ==================== -->
  <!-- PC -> MAR -->
  <path d="M 300 180 L 300 238" fill="none" stroke="#0052cc" stroke-width="3" marker-end="url(#arrow-addr)" />
  <text x="306" y="210" font-size="9.5" font-weight="600" fill="#0052cc">8 bits</text>

  <!-- MAR -> RAM (Porta A) -->
  <path d="M 250 265 L 162 265" fill="none" stroke="#0052cc" stroke-width="3" marker-end="url(#arrow-addr)" />
  <text x="185" y="258" font-size="9.5" font-weight="600" fill="#0052cc">MAR → RAM</text>

  <!-- ==================== BARRAMENTO DE DADOS (VERDE) ==================== -->
  <!-- RAM <-> MBR -->
  <path d="M 160 380 L 248 380" fill="none" stroke="#00875a" stroke-width="3.5" marker-end="url(#arrow-data)" />
  <text x="175" y="373" font-size="9.5" font-weight="600" fill="#00875a">RAM ↔ MBR</text>

  <!-- MBR -> IR -->
  <path d="M 350 385 L 380 385 L 380 155 L 418 155" fill="none" stroke="#00875a" stroke-width="3" marker-end="url(#arrow-data)" />

  <!-- MBR -> ULA (Entrada A) -->
  <path d="M 350 395 L 588 395" fill="none" stroke="#00875a" stroke-width="3" marker-end="url(#arrow-data)" />
  <text x="545" y="390" font-size="9" font-weight="600" fill="#00875a">in A</text>

  <!-- AC -> ULA (Entrada B) -->
  <path d="M 700 255 L 700 345 L 672 345" fill="none" stroke="#00875a" stroke-width="3" marker-end="url(#arrow-data)" />
  <text x="680" y="338" font-size="9" font-weight="600" fill="#00875a">in B</text>

  <!-- ULA -> AC -->
  <path d="M 670 370 L 730 370 L 730 257" fill="none" stroke="#00875a" stroke-width="3" marker-end="url(#arrow-data)" />
  <text x="735" y="320" font-size="9" font-weight="600" fill="#00875a">Soma</text>

  <!-- AC -> Monitor/SAIDA -->
  <path d="M 750 230 L 828 230" fill="none" stroke="#00875a" stroke-width="3.5" marker-end="url(#arrow-data)" />

  <!-- Teclado -> RAM e Teclado -> AC -->
  <path d="M 100 160 L 100 208" fill="none" stroke="#00875a" stroke-width="2.5" marker-end="url(#arrow-data)" />
  <text x="105" y="188" font-size="8.5" font-weight="600" fill="#00875a">Gravação</text>

  <!-- Teclado -> AC (Instrução IN) -->
  <path d="M 160 135 L 700 135 L 700 198" fill="none" stroke="#00875a" stroke-width="2.5" stroke-dasharray="4,2" marker-end="url(#arrow-data)" />
  <text x="560" y="128" font-size="9" font-weight="600" fill="#00875a">Teclado → AC (IN)</text>

  <!-- ==================== CONTROLE E CLOCK (TRACEJADO LARANJA/VERMELHO) ==================== -->
  <!-- IR -> UC (Opcode) -->
  <path d="M 470 180 L 470 228" fill="none" stroke="#ffab00" stroke-width="2.5" marker-end="url(#arrow-ctrl)" />
  <text x="475" y="206" font-size="9" font-weight="600" fill="#ffab00">IR[7:4]</text>

  <!-- Linhas de controle saindo da UC -->
  <path d="M 410 250 L 352 250" fill="none" stroke="#de350b" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow-ctrl)" />
  <text x="360" y="244" font-size="8" fill="#de350b">MAR_Load</text>

  <path d="M 410 270 L 370 270 L 370 170 L 352 170" fill="none" stroke="#de350b" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow-ctrl)" />
  <text x="375" y="165" font-size="8" fill="#de350b">PC_Inc</text>

  <path d="M 410 280 L 390 280 L 390 370 L 352 370" fill="none" stroke="#de350b" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow-ctrl)" />
  <text x="365" y="364" font-size="8" fill="#de350b">MBR_Load</text>

  <path d="M 530 240 L 648 240" fill="none" stroke="#de350b" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow-ctrl)" />
  <text x="580" y="234" font-size="8" fill="#de350b">AC_Exec / AC_Load</text>

  <!-- Clock distribuído -->
  <path d="M 448 455 L 280 455 L 280 412" fill="none" stroke="#de350b" stroke-width="1.8" stroke-dasharray="3,3" marker-end="url(#arrow-ctrl)" />
  <path d="M 492 455 L 720 455 L 720 257" fill="none" stroke="#de350b" stroke-width="1.8" stroke-dasharray="3,3" marker-end="url(#arrow-ctrl)" />

  <!-- ==================== LEGENDA OFICIAL ==================== -->
  <g id="legenda" transform="translate(180, 520)">
    <rect x="0" y="0" width="640" height="75" rx="6" fill="#ffffff" stroke="#dfe1e6" stroke-width="1.5" />
    <text x="15" y="20" font-size="11" font-weight="700" fill="#172b4d">LEGENDA DO DIAGRAMA (Conforme Relatório Teórico):</text>
    
    <!-- Linha Endereços -->
    <line x1="20" y1="40" x2="60" y2="40" stroke="#0052cc" stroke-width="3.5" marker-end="url(#arrow-addr)" />
    <text x="70" y="44" font-size="10.5" fill="#172b4d">Barramento de Endereços (8 bits, unidirecional: PC → MAR → RAM)</text>

    <!-- Linha Dados -->
    <line x1="20" y1="60" x2="60" y2="60" stroke="#00875a" stroke-width="3.5" marker-end="url(#arrow-data)" />
    <text x="70" y="64" font-size="10.5" fill="#172b4d">Barramento de Dados (8 bits: RAM ↔ MBR, MBR → IR/ULA, AC → ULA, ULA → AC, Monitor, Teclado)</text>

    <!-- Linha Controle / Clock -->
    <line x1="430" y1="40" x2="470" y2="40" stroke="#de350b" stroke-width="2.5" stroke-dasharray="4,3" marker-end="url(#arrow-ctrl)" />
    <text x="480" y="44" font-size="10.5" fill="#172b4d">Controle e Clock (1,0 Hz)</text>
  </g>
</svg>